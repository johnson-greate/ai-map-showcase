   return '<g class="pin" data-p="'+p.id+'" transform="translate('+x+' '+y+') scale('+(1/Math.sqrt(zoom))+')" role="button" tabindex="0" aria-label="'+label+'，'+p.capital+'" opacity="'+(activeRegion===null||regionOf(p.id)===activeRegion?1:.35)+'"><title>'+label+' · '+p.capital+'</title><circle cy="-5" r="6" fill="transparent"/>'+use(sel?'selectedpin':'office',0,0,sel?1:.8)+(sel?'<g transform="translate('+(labelRight?11:-w-11)+' -30)"><rect y="1.5" width="'+w+'" height="22" rx="6" fill="#819383" opacity=".25"/><rect width="'+w+'" height="22" rx="5" fill="#fffdf1" stroke="#bf8065"/><text x="'+w/2+'" y="15.3" text-anchor="middle" font-size="13.5" font-weight="700" fill="#774c3c">'+label+'</text></g>':'')+'</g>';
 }).join('');
 const labels=[[684,54,'北海道',706,90],[714,194,'東北',612,217],[620,318,'關東',553,295],[447,235,'中部',448,268],[374,399,'近畿',370,344],[258,270,'中國',270,320],[254,404,'四國',288,363],[64,355,'九州',141,366]].map(a=>projectTag(...a)).join('');
 map.innerHTML='<title id="mapTitle">日本都道府縣立體地圖</title><desc id="mapDesc">圖釘指向各廳舍，色塊代表八大地方。</desc>'+defs+
 `<rect width="840" height="478" fill="#e2eee5"/><rect width="840" height="478" fill="url(#grid)"/><rect width="840" height="478" fill="url(#water)"/><g id="camera" class="svglabel">
 <g pointer-events="none"><text x="303" y="171" class="sea" text-anchor="middle" font-size="19">日本海</text><text x="303" y="187" text-anchor="middle" font-family="Georgia" font-style="italic" font-size="11" letter-spacing="1.7" fill="#7e9c90">Sea of Japan</text>
 <text x="506" y="410" class="sea" text-anchor="middle" font-size="20">太平洋</text><text x="506" y="427" text-anchor="middle" font-family="Georgia" font-style="italic" font-size="11" letter-spacing="1.8" fill="#7e9c90">Pacific Ocean</text></g>
 <rect x="648" y="315" width="133" height="103" rx="9" fill="#e8f2e8" stroke="#95ae9c" stroke-dasharray="4 3"/><text x="659" y="334" font-size="11" fill="#526d5d" font-weight="700">沖繩本島・放大圖</text>
 <g pointer-events="none">`+use('guide',131,111,1.12)+use('boat',230,189,.78)+use('boat',566,364,.61)+use('buoy',590,377,.6)+
 '<g opacity=".19" transform="translate(2 9)">'+prefectures.map(p=>'<use href="#shape'+p.id+'" fill="#547a70" stroke="#547a70" stroke-width="3"/>').join('')+'</g>'+relief(6)+relief(3)+'</g>'+shapes+'<g pointer-events="none">'+grain+scenery+labels+'</g>'+pins+'</g>'+
 `<g transform="translate(42 48)" pointer-events="none" fill="#526c5b" text-anchor="middle"><text y="-18" font-size="10" font-family="Georgia">N</text><circle cy="1" r="13" fill="none" stroke="#91a797" stroke-width=".8"/><path d="m0-13-5 20 5-4 5 4z" fill="#627b69"/><path d="M0-13V3l5 4z" fill="#fbf9e7"/></g>`;
 camera();
}
function camera(){
 cx=Math.max(420/zoom,Math.min(840-420/zoom,cx));cy=Math.max(239/zoom,Math.min(478-239/zoom,cy));
 $('camera').setAttribute('transform','translate(420 239) scale('+zoom+') translate('+(-cx)+' '+(-cy)+')');
 map.querySelectorAll('.pin').forEach(pin=>{
   const p=byId[pin.dataset.p];const [x,y]=position(p.lon,p.lat,p.id);
   pin.setAttribute('transform','translate('+x+' '+y+') scale('+(1/Math.pow(zoom,.75))+')');
 });
 $('plus').disabled=zoom>=5;$('minus').disabled=zoom<=1;
 map.classList.toggle('zoomed',zoom>1);
}
function focusPoint(x,y,z){cx=x;cy=y;zoom=Math.max(1,Math.min(5,z));camera()}
function showProfile(){
 const p=byId[selected],ri=regionOf(p.id);
 $('profile').innerHTML='<div class="picture">'+postcard(p.id,ri)+'<span class="picturebadge">'+(selected==='13'?'TOKYO':selected==='47'?'OKINAWA':['HOKKAIDO','TOHOKU','KANTO','CHUBU','KINKI','CHUGOKU','SHIKOKU','KYUSHU'][ri])+' POSTCARD</span></div><div class="profilebody"><div class="profileline"><span class="regionpill" style="--region:'+colors[ri]+'">'+regions[ri]+(ri===0?'':'地方')+'</span><span class="code">JIS '+p.id+'</span></div><h2 class="pname">'+p.zh+'</h2><div class="kana" lang="ja">'+p.kana+'</div><div class="fields"><div class="field"><span>日文正名</span><b lang="ja">'+p.ja+'</b></div><div class="field"><span>簡稱</span><b>'+p.short+(p.shortJa!==p.short?' ／ '+p.shortJa:'')+'</b></div><div class="field"><span>廳舍所在地</span><b>'+p.capital+(p.capitalJa==='さいたま市'?'（さいたま市）':'')+'</b></div></div><div class="stats"><div class="stat"><div class="statlabel">'+icon('person')+'登記人口<small>2026.01.01</small></div><div class="amount">'+nf.format(p.population)+'<small>人</small></div></div><div class="stat"><div class="statlabel">'+icon('chart')+'名目 GDP<small>2023 財政年度</small></div><div class="amount">'+gdp(p)+'<small>兆日圓</small></div></div></div></div><div class="profilefoot"><button data-step="-1" aria-label="上一個都道府縣">'+icon('left')+'</button><span>都道府縣檔案　'+p.id+' / 47</span><button data-step="1" aria-label="下一個都道府縣">'+icon('right')+'</button></div>';
}
function updateLegend(){
 $('regions').innerHTML=regions.map((r,i)=>'<button data-region="'+i+'" aria-pressed="'+(i===activeRegion)+'"><i class="swatch" style="background:'+colors[i]+'"></i>'+r+'</button>').join('');
 $('filterstatus').textContent=activeRegion===null?'點選色塊聚焦地方':regions[activeRegion]+' · 再點一次返回全國';
}
function select(id,center=false){
 selected=id;
 if(activeRegion!==null&&regionOf(id)!==activeRegion)activeRegion=null;
 draw();showProfile();updateLegend();
 if(center||zoom>1){const p=byId[id];focusPoint(...position(p.lon,p.lat,p.id),center?Math.max(zoom,1.65):zoom)}
}
function reset(){activeRegion=null;zoom=1;cx=420;cy=239;draw();updateLegend()}
function changeRegion(i){
 if(activeRegion===i){reset();return}
 activeRegion=i;const group=prefectures.filter(p=>regionOf(p.id)===i);
 if(regionOf(selected)!==i)selected=group[0].id;
 draw();showProfile();updateLegend();
 const points=group.filter(p=>p.id!=='47').flatMap(p=>p.rings[0].map(([x,y])=>position(x,y,p.id)));
 if(i===7){focusPoint(420,239,1);return}
 const xs=points.map(p=>p[0]),ys=points.map(p=>p[1]);
 const x0=Math.min(...xs),x1=Math.max(...xs),y0=Math.min(...ys),y1=Math.max(...ys);
 focusPoint((x0+x1)/2,(y0+y1)/2,Math.min(3.1,700/(x1-x0+38),372/(y1-y0+32)));
}
const clean=q=>q.trim().normalize('NFKC').toLowerCase();
function findRecords(q){
 const term=clean(q);
 return prefectures.filter(p=>[p.id,p.ja,p.zh,p.shortJa,p.kana,p.capital,p.capitalJa,regions[regionOf(p.id)]].some(v=>clean(v).includes(term)));
}
function list(){
 const rows=findRecords($('listsearch').value);
 if(order)rows.sort((a,b)=>direction*(a[order]-b[order])||a.id.localeCompare(b.id));
 $('rows').innerHTML=rows.map(p=>'<tr><td>'+p.id+'</td><td><button data-goto="'+p.id+'" lang="ja">'+p.ja+'</button>'+(p.ja!==p.zh?'<small>'+p.zh+'</small>':'')+'</td><td>'+p.short+'</td><td>'+regions[regionOf(p.id)]+'</td><td>'+p.capital+'</td><td class="num">'+nf.format(p.population)+'</td><td class="num">'+gdp(p)+'</td></tr>').join('');
 $('rowcount').textContent=rows.length?'顯示 '+rows.length+' 個都道府縣。人口基準日為 2026 年 1 月 1 日，GDP 為 2023 財政年度。':'沒有符合的都道府縣，請嘗試其他縣名或城市。';
 for(const [key,name] of [['population','sortpop'],['gdp','sortgdp']]){
  const th=$(name).closest('th');th.setAttribute('aria-sort',key===order?(direction===-1?'descending':'ascending'):'none');
  $(name).textContent=(key==='population'?'人口（人）':'名目 GDP（兆日圓）')+' '+(key===order?(direction===-1?'↓':'↑'):'↕');
 }
}
function tab(view){
 for(const v of ['map','list','sources'])$(v+'Tab').hidden=v!==view;
 document.querySelectorAll('nav button').forEach(b=>{b.classList.toggle('active',b.dataset.tab===view);if(b.dataset.tab===view)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')});
 if(view==='list')list();
 $('matches').hidden=true;
}
const search=$('search');
function matches(){
 const term=search.value.trim();$('matches').hidden=!term;if(!term)return;
 const found=findRecords(term);
 $('matches').innerHTML=found.length?found.map(p=>'<button data-goto="'+p.id+'"><b>'+p.zh+'</b><small>'+p.capital+' · '+p.id+'</small></button>').join(''):'<p>沒有相符的縣市</p>';
}
function jump(id){tab('map');select(id,true);search.value='';$('matches').hidden=true}
document.addEventListener('click',e=>{
 const btn=e.target.closest('button');if(!btn){if(!e.target.closest('.searchbox'))$('matches').hidden=true;return}
 if(btn.dataset.tab){tab(btn.dataset.tab);return}
 if(btn.dataset.goto){jump(btn.dataset.goto);return}
 if(btn.dataset.region!==undefined){changeRegion(Number(btn.dataset.region));return}
 if(btn.dataset.step){const p=prefectures[(Number(selected)-1+Number(btn.dataset.step)+47)%47];select(p.id);const next=$('profile').querySelector('[data-step="'+btn.dataset.step+'"]');if(e.detail===0)next.focus();return}
 if(btn.id==='reset'){reset();return}
 if(btn.id==='plus'||btn.id==='minus'){
  if(zoom===1&&btn.id==='plus'){const p=byId[selected];[cx,cy]=position(p.lon,p.lat,p.id)}
  focusPoint(cx,cy,btn.id==='plus'?zoom*1.5:zoom/1.5);return;
 }
 if(btn.id==='sortpop'||btn.id==='sortgdp'){const key=btn.id==='sortpop'?'population':'gdp';direction=key===order?-direction:-1;order=key;list()}
});
search.addEventListener('input',matches);
search.addEventListener('focus',matches);
search.addEventListener('keydown',e=>{
 const first=$('matches').querySelector('button');
 if(e.key==='Escape')$('matches').hidden=true;
 if(!$('matches').hidden&&first){if(e.key==='Enter'){e.preventDefault();jump(first.dataset.goto)}if(e.key==='ArrowDown'){e.preventDefault();first.focus()}}
});
$('matches').addEventListener('keydown',e=>{if(e.key==='Escape'){$('matches').hidden=true;search.focus();$('matches').hidden=true}});
$('listsearch').addEventListener('input',list);
let dragging=null,suppressClick=false;
map.addEventListener('pointerdown',e=>{
 suppressClick=false;if(zoom<=1||e.button!==0)return;
 dragging={id:e.pointerId,x:e.clientX,y:e.clientY,cx,cy,moved:false};
});
map.addEventListener('pointermove',e=>{
 if(!dragging||dragging.id!==e.pointerId)return;
 const dx=e.clientX-dragging.x,dy=e.clientY-dragging.y;
 if(!dragging.moved&&Math.hypot(dx,dy)<4)return;
 dragging.moved=true;map.setPointerCapture(e.pointerId);map.classList.add('dragging');
 const scale=map.getScreenCTM().a*zoom;
 cx=dragging.cx-dx/scale;cy=dragging.cy-dy/scale;camera();
});
function endDrag(){if(dragging){suppressClick=dragging.moved;dragging=null;map.classList.remove('dragging')}}
window.addEventListener('pointerup',endDrag);window.addEventListener('pointercancel',endDrag);
map.addEventListener('click',e=>{if(suppressClick){suppressClick=false;return}const target=e.target.closest('[data-p]');if(target)select(target.dataset.p)});

$('sourcecopy').innerHTML=`<article><h3>登記人口 · 2026 年 1 月 1 日</h3><p>採用日本總務省「住民基本台帳に基づく人口、人口動態及び世帯数調査」表 26-01 的總計人口，按居民登記地統計日本籍與外籍居民。這是截至 2026 年 11 月 24 日可核實、涵蓋全國 47 個都道府縣的最新同系列年度數字。各地方政府另有不同月份的人口推計。<a href="https://www.e-stat.go.jp/stat-search/files?stat_infid=000040479047" target="_blank" rel="noopener">e-Stat 原表 ↗</a></p></article>
<article><h3>名目 GDP · 2023 財政年度</h3><p>採用內閣府最新全國彙編的生產面名目縣內總生產，期間為 2023 年 4 月至 2024 年 3 月。數值按茨城縣統計課整理的全國表核對，以兆日圓顯示至小數點後四位，相當於 1 億日圓。GDP 衡量在當地生產的附加價值。<a href="https://www.esri.cao.go.jp/jp/sna/data/data_list/kenmin/files/contents/main_2023.html" target="_blank" rel="noopener">內閣府統計表 ↗</a>　<a href="https://www.pref.ibaraki.jp/somu/hodo/hodo/pressrelease/hodohappyoushiryou/2203/documents/261105toukei.pdf" target="_blank" rel="noopener">全國對照表（第 2 頁）↗</a></p></article>
<article><h3>正名、簡稱與廳舍所在地</h3><p>日文正名保留「都」「道」「府」「県」及原字形。「簡稱」採日常通行地名，例如「東京都」簡稱「東京」，北海道則保留全名。東京都廳位於新宿區；埼玉縣廳所在城市的日文正式寫法為「さいたま市」。都道府縣檔案按 JIS 代碼排列。</p></article>
<article><h3>界線、圖釘與地方分類</h3><p>界線取自國土交通省 2026 年 1 月 1 日國土數值情報行政區域資料，使用 ricewin 的簡化版本，合併市町村後再簡化及立體化。圖釘標示都道府縣廳舍位置。沖繩本島移位放大，部分離島從略。底圖以北為上方，採斜投影示意；地塊厚度與景物插畫只作視覺辨識。八地方分類將三重縣列入近畿，沖繩與九州合併顯示。<a href="https://nlftp.mlit.go.jp/ksj/" target="_blank" rel="noopener">國土數值情報 ↗</a>　<a href="https://github.com/ricewin/simplify-japan-geojson" target="_blank" rel="noopener">ricewin 圖資 ↗</a>　<a href="https://creativecommons.org/licenses/by/4.0/" target="_blank" rel="noopener">CC BY 4.0 ↗</a>　<a href="https://www.benricho.org/chimei/latlng_data.html" target="_blank" rel="noopener">廳舍座標 ↗</a></p></article>`;
